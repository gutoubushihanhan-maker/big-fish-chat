
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼 AI 聊天室</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eaf6ff;
}

header {
  background: #49a9ed;
  color: white;
  padding: 16px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.toolbar {
  padding: 8px 14px;
  text-align: right;
  background: #dcefff;
}

.toolbar button {
  background: white;
  color: #397bb0;
  border: 1px solid #b6d9f5;
  padding: 8px 14px;
  border-radius: 16px;
}

#chat {
  height: calc(100dvh - 177px);
  overflow-y: auto;
  padding: 16px;
}

.msg {
  padding: 12px 15px;
  margin: 12px 0;
  border-radius: 16px;
  max-width: 80%;
  line-height: 1.6;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.fish {
  background: white;
  margin-right: auto;
}

.me {
  background: #a6e8b5;
  margin-left: auto;
}

.thinking {
  color: #888;
  font-style: italic;
}

footer {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: white;
}

input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 20px;
  font-size: 16px;
}

#sendBtn {
  border: none;
  border-radius: 20px;
  padding: 0 18px;
  background: #49a9ed;
  color: white;
  font-size: 16px;
}

#sendBtn:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>🐳 大肥鱼 AI</header>

<div class="toolbar">
  <button onclick="clearChat()">
    🗑️ 清空聊天
  </button>
</div>

<div id="chat"></div>

<footer>
  <input id="input"
    placeholder="和大肥鱼说点什么..."
    maxlength="2000">
  <button id="sendBtn" onclick="send()">
    发送
  </button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

const API_URL =
  "https://big-fish-ai.gutoubushihanhan.workers.dev/";

const STORAGE_KEY = "big-fish-chat-history-v1";

let history = [];
let sending = false;
let session = 0;

try {
  const saved = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );
  if (Array.isArray(saved)) {
    history = saved.filter(item =>
      item &&
      typeof item.text === "string" &&
      ["me", "fish"].includes(item.type)
    ).slice(-100);
  }
} catch (e) {
  history = [];
}

function saveHistory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history)
    );
  } catch (e) {
    console.warn("聊天记录保存失败", e);
  }
}

function addMessage(text, type, save = true) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  if (save) {
    history.push({ text, type });
    history = history.slice(-100);
    saveHistory();
  }

  return div;
}

function showWelcome() {
  addMessage(
    "🐳 你好呀！我是大肥鱼！今天想聊些什么？",
    "fish",
    false
  );
}

if (history.length) {
  history.forEach(item =>
    addMessage(item.text, item.type, false)
  );
} else {
  showWelcome();
}

function clearChat() {
  if (!confirm("确定清空聊天记录吗？")) {
    return;
  }

  session++;
  history = [];
  saveHistory();
  chat.innerHTML = "";
  showWelcome();
}

async function send() {
  const text = input.value.trim();
  if (!text || sending) return;

  const currentSession = session;
  sending = true;
  sendBtn.disabled = true;

  addMessage(text, "me");
  input.value = "";

  const thinking = addMessage(
    "🐳 大肥鱼正在思考...",
    "fish thinking",
    false
  );

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "请求失败");
    }

    if (currentSession !== session) return;

    thinking.remove();
    addMessage(data.reply, "fish");

  } catch (error) {
    if (currentSession !== session) return;

    thinking.remove();
    addMessage(
      "🐳 云端连接失败，请稍后再试。",
      "fish"
    );
    console.error(error);

  } finally {
    sending = false;
    sendBtn.disabled = false;
  }
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
