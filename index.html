
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼 AI 聊天室</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eaf6ff;
}
header {
  background: #49a9ed;
  color: white;
  padding: 18px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}
#chat {
  height: calc(100dvh - 145px);
  overflow-y: auto;
  padding: 16px;
}
.msg {
  padding: 12px 15px;
  margin: 12px 0;
  border-radius: 16px;
  max-width: 80%;
  line-height: 1.6;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.fish {
  background: white;
  margin-right: auto;
}
.me {
  background: #a6e8b5;
  margin-left: auto;
}
footer {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: white;
}
input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 20px;
  font-size: 16px;
}
button {
  border: none;
  border-radius: 20px;
  padding: 0 18px;
  background: #49a9ed;
  color: white;
  font-size: 16px;
}
</style>
</head>
<body>

<header>🐳 大肥鱼 AI</header>

<div id="chat">
  <div class="msg fish">
    🐳 你好呀！我是大肥鱼！
    今天想聊些什么？
  </div>
</div>

<footer>
  <input id="input" placeholder="和大肥鱼说点什么...">
  <button onclick="send()">发送</button>
</footer>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");

const API_URL =
  "https://big-fish-ai.gutoubushihanhan.workers.dev/";

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

let sending = false;

async function send() {
  const text = input.value.trim();
  if (!text || sending) return;

  sending = true;
  addMessage(text, "me");
  input.value = "";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "请求失败");
    }

    addMessage(data.reply, "fish");

  } catch (error) {
    addMessage(
      "🐳 云端连接失败，请稍后再试。",
      "fish"
    );
    console.error(error);
  } finally {
    sending = false;
  }
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

</script>

</body>
</html>
