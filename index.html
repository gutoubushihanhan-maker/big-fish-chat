
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8f5ff">
<title>🐳 大肥鱼的聊天小屋</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,"Microsoft YaHei",sans-serif}
body{background:#e8f5ff;color:#24475f}
.app{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  max-width:700px;margin:auto;
  background:linear-gradient(#e7f6ff,#dceeff);
}
header{
  background:#fff;
  display:flex;align-items:center;
  padding:14px 16px;gap:12px;
  box-shadow:0 2px 12px #89c7ef25;
}
.avatar{
  width:48px;height:48px;
  display:grid;place-items:center;
  border-radius:50%;background:#c9eaff;
  font-size:27px;flex-shrink:0;
}
.name{font-size:19px;font-weight:bold}
.status{font-size:12px;color:#5595b7;margin-top:4px}
.dot{
  display:inline-block;width:7px;height:7px;
  border-radius:50%;background:#49bd8a;
  margin-right:5px;
}
.clear{
  margin-left:auto;border:1px solid #c4e3f7;
  background:#f1faff;color:#448cb8;
  padding:9px 11px;border-radius:16px;
  font-size:13px;
}
#chat{
  flex:1;min-height:0;overflow-y:auto;
  padding:20px 14px;
}
.time{
  text-align:center;color:#7da4bc;
  font-size:11px;margin:16px 0;
}
.message{
  display:flex;align-items:flex-end;
  gap:8px;margin:14px 0;
}
.message.me{justify-content:flex-end}
.mini{
  width:34px;height:34px;
  border-radius:50%;background:white;
  display:grid;place-items:center;
  flex-shrink:0;font-size:20px;
}
.bubble{
  max-width:77%;padding:12px 14px;
  border-radius:18px;
  line-height:1.6;font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  box-shadow:0 2px 7px #9bc4dd20;
}
.fish .bubble{
  background:white;
  border-bottom-left-radius:5px;
}
.me .bubble{
  background:#a7dffb;
  border-bottom-right-radius:5px;
}
.thinking .bubble{color:#7896aa}
footer{
  display:flex;align-items:center;
  gap:9px;padding:12px;
  padding-bottom:max(12px,env(safe-area-inset-bottom));
  background:#fff;
}
#input{
  flex:1;min-width:0;
  padding:13px 15px;
  border:1px solid #d6e7f2;
  border-radius:24px;
  outline:none;font-size:16px;
  background:#f7fbff;
}
#input:focus{border-color:#49a9ed}
#sendBtn{
  width:46px;height:46px;
  border:0;border-radius:50%;
  background:#49a9ed;color:white;
  font-size:21px;flex-shrink:0;
}
#sendBtn:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="avatar">🐳</div>
  <div>
    <div class="name">大肥鱼</div>
    <div class="status">
      <span class="dot"></span>云端聊天小屋
    </div>
  </div>
  <button class="clear" onclick="clearChat()">
    🗑️ 清空
  </button>
</header>

<main id="chat"></main>

<footer>
  <input id="input" maxlength="2000"
    placeholder="和大肥鱼说点什么...">
  <button id="sendBtn" onclick="send()"
    aria-label="发送消息">➤</button>
</footer>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const sendBtn=document.getElementById("sendBtn");

const API_URL=
"https://big-fish-ai.gutoubushihanhan.workers.dev/";

const STORAGE_KEY="big-fish-chat-history-v1";
let history=[];
let sending=false;
let session=0;

try{
  const saved=JSON.parse(
    localStorage.getItem(STORAGE_KEY)||"[]"
  );
  if(Array.isArray(saved)){
    history=saved.filter(x=>
      x&&typeof x.text==="string"&&
      ["me","fish"].includes(x.type)
    ).slice(-100);
  }
}catch(e){history=[]}

function saveHistory(){
  try{
    localStorage.setItem(
      STORAGE_KEY,JSON.stringify(history)
    );
  }catch(e){
    console.warn("保存失败",e);
  }
}


function addMessage(text,type,save=true,time=Date.now()){
  const wrap=document.createElement("div");
  wrap.className="message "+type;

  if(type==="fish"){
    const avatar=document.createElement("div");
    avatar.className="mini";
    avatar.textContent="🐳";
    wrap.appendChild(avatar);
  }

  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=text;
  wrap.appendChild(bubble);

  const clock=document.createElement("div");
  clock.className="time";
  clock.textContent=new Date(time).toLocaleTimeString(
    "zh-CN",{hour:"2-digit",minute:"2-digit"}
  );

  let record=save?{text,type,time}:
    history.find(item=>item.time===time&&item.type===type&&item.text===text);

  if(save){
    history.push(record);
    history=history.slice(-100);
    saveHistory();
  }

  if(record){
    const del=document.createElement("button");
    del.textContent="×";
    del.type="button";
    del.title="删除这条消息";
    del.style.cssText="margin:4px 0 0 8px;padding:3px 8px;border:0;border-radius:10px;background:#fff;color:#789;cursor:pointer;font-size:16px;";

    del.addEventListener("click",()=>{
      if(!confirm("确定删除这条消息吗？"))return;

      const index=history.indexOf(record);
      if(index<0)return;

      history.splice(index,1);
      saveHistory();

      chat.innerHTML="";
      if(history.length){
        history.forEach(item=>{
          addMessage(item.text,item.type,false,item.time);
        });
      }else{
        welcome();
      }
    });

    wrap.appendChild(del);
  }

  chat.appendChild(clock);
  chat.appendChild(wrap);
  chat.scrollTop=chat.scrollHeight;

  return {wrap,clock};
}


function welcome(){
  addMessage(
    "🐳 你好呀！我是大肥鱼～今天想聊些什么？🍚",
    "fish",false
  );
}

if(history.length){
  history.forEach(x=>
    addMessage(x.text,x.type,false,x.time||Date.now())
  );
}else{
  welcome();
}

function clearChat(){
  if(!confirm("确定清空聊天记录吗？"))return;
  session++;
  history=[];
  saveHistory();
  chat.innerHTML="";
  welcome();
}

async function send(){
  const text=input.value.trim();
  if(!text||sending)return;

  const currentSession=session;
  sending=true;
  sendBtn.disabled=true;
  addMessage(text,"me");
  input.value="";

  const waiting=addMessage(
    "大肥鱼正在思考...","fish thinking",false
  );

  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
  message:text,
  history:history.slice(0,-1).slice(-11).map(item=>({
    role:item.type==="fish"?"assistant":"user",
    content:item.text
  }))
})
    });

    const data=await response.json();
    if(!response.ok){
      throw new Error(data.error||"请求失败");
    }
    if(currentSession!==session)return;

    waiting.wrap.remove();
    waiting.clock.remove();
    addMessage(data.reply,"fish");

  }catch(error){
    if(currentSession!==session)return;
    waiting.wrap.remove();
    waiting.clock.remove();
    addMessage(
      "🐳 云端连接失败，请稍后再试。","fish"
    );
    console.error(error);
  }finally{
    sending=false;
    sendBtn.disabled=false;
  }
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.isComposing)send();
});
</script>
</body>
</html>
