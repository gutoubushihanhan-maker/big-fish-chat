
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8f5ff">
<title>🐳 大肥鱼的聊天小屋</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,"Microsoft YaHei",sans-serif}
body{background:#e8f5ff;color:#24475f}
.app{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  max-width:700px;margin:auto;
  background:linear-gradient(#e7f6ff,#dceeff);
}
header{
  background:#fff;
  display:flex;align-items:center;
  padding:14px 16px;gap:12px;
  box-shadow:0 2px 12px #89c7ef25;
}
.avatar{
  width:48px;height:48px;
  display:grid;place-items:center;
  border-radius:50%;background:#c9eaff;
  font-size:27px;flex-shrink:0;
}
.name{font-size:19px;font-weight:bold}
.status{font-size:12px;color:#5595b7;margin-top:4px}
.dot{
  display:inline-block;width:7px;height:7px;
  border-radius:50%;background:#49bd8a;
  margin-right:5px;
}
.clear{
  margin-left:auto;border:1px solid #c4e3f7;
  background:#f1faff;color:#448cb8;
  padding:9px 11px;border-radius:16px;
  font-size:13px;
}
#chat{
  flex:1;min-height:0;overflow-y:auto;
  padding:20px 14px;
}
.time{
  text-align:center;color:#7da4bc;
  font-size:11px;margin:16px 0;
}
.message{
  display:flex;align-items:flex-end;
  gap:8px;margin:14px 0;
}
.message.me{justify-content:flex-end}
.mini{
  width:34px;height:34px;
  border-radius:50%;background:white;
  display:grid;place-items:center;
  flex-shrink:0;font-size:20px;
}
.bubble{
  max-width:77%;padding:12px 14px;
  border-radius:18px;
  line-height:1.6;font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  box-shadow:0 2px 7px #9bc4dd20;
}
.fish .bubble{
  background:white;
  border-bottom-left-radius:5px;
}
.me .bubble{
  background:#a7dffb;
  border-bottom-right-radius:5px;
}
.thinking .bubble{color:#7896aa}
footer{
  display:flex;align-items:center;
  gap:9px;padding:12px;
  padding-bottom:max(12px,env(safe-area-inset-bottom));
  background:#fff;
}
#input{
  flex:1;min-width:0;
  padding:13px 15px;
  border:1px solid #d6e7f2;
  border-radius:24px;
  outline:none;font-size:16px;
  background:#f7fbff;
}
#input:focus{border-color:#49a9ed}
#sendBtn{
  width:46px;height:46px;
  border:0;border-radius:50%;
  background:#49a9ed;color:white;
  font-size:21px;flex-shrink:0;
}
#sendBtn:disabled{opacity:.5}
header{flex-wrap:wrap;gap:8px}header .clear{margin-left:0}.message{flex-wrap:wrap}.bubble{min-width:0}#input{resize:vertical;max-height:180px;font:inherit} .tools{display:flex;gap:8px;flex-wrap:wrap;padding:6px 12px}.tools button{padding:7px 10px;border:1px solid #b8d6e8;border-radius:12px;cursor:pointer}body.dark{color-scheme:dark;background:#111d2c;color:#e3edf7}body.dark .app{background:#142438}body.dark header,body.dark footer,body.dark dialog{background:#1b3046;color:#e3edf7}body.dark .fish .bubble{background:#263e55}body.dark .me .bubble{background:#275d7b}body.dark #input{background:#142438;color:#e3edf7}body.dark button{background:#263e55!important;color:#e3edf7!important}body.dark .time{color:#a3bbce}body.dark .mini{background:#263e55}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="avatar">🐳</div>
  <div>
    <div class="name">大肥鱼</div>
    <div class="status">
      <span class="dot"></span>云端聊天小屋
    </div>
  </div>
  <button class="clear" type="button" onclick="exportChat()">导出</button>
  <button class="clear" onclick="clearChat()">
    🗑️ 清空
  </button>
</header>

<button type="button" onclick="openMemory()">🧠 长期记忆（查看 / 保存 / 删除）</button>
<div class="tools"><button type="button" id="themeBtn" onclick="toggleTheme()">切换深色模式</button><button type="button" onclick="regenerate()">重新生成上一答</button><button type="button" onclick="goBottom()">↓ 回到底部</button></div>
<main id="chat"></main>

<footer>
  <textarea id="input" rows="2" maxlength="2000" aria-label="聊天消息" placeholder="Enter 发送，Shift + Enter 换行"></textarea>
  <button id="stopBtn" type="button" hidden onclick="stopReply()">停止</button>
  <button id="sendBtn" onclick="send()"
    aria-label="发送消息">➤</button>
</footer>
</div>

<dialog id="memoryDialog" style="max-width:90%;border:0;border-radius:16px;padding:20px">
<h2>长期记忆</h2><p>仅保存你选择并确认的普通偏好，不自动保存聊天。<br>凭证保存在此浏览器；共用电脑请勿使用。清空聊天不会删除记忆。</p>
<select id="memoryChoice" aria-label="选择偏好"></select>
<button onclick="saveMemory()">确认保存所选偏好</button>
<p id="memoryStatus" role="status"></p><div id="memoryList"></div>
<button onclick="clearMemory()">删除全部云端记忆</button>
<button onclick="document.getElementById('memoryDialog').close()">关闭</button></dialog>
<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const sendBtn=document.getElementById("sendBtn");

const API_URL=
"https://big-fish-ai.gutoubushihanhan.workers.dev/";

const memoryOptions={rice:"喜欢白米饭",noodles:"喜欢面条",fruit:"喜欢水果",reading:"喜欢阅读",music:"喜欢音乐",games:"喜欢游戏",concise:"希望回答简短",detailed:"希望回答详细"};
let memoryToken="";
function memoryHeaders(){
 try {
  if(!memoryToken){
   memoryToken=localStorage.getItem("fish-memory-token-v1")||"";
   if(!/^[a-f0-9]{64}$/.test(memoryToken)){
    memoryToken=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,"0")).join("");
    localStorage.setItem("fish-memory-token-v1",memoryToken);
   }
  }
  return {Authorization:"Bearer "+memoryToken};
 }catch{return {};}
}
async function memoryRequest(action,extra={}){
 const headers=memoryHeaders();
 if(!headers.Authorization)throw new Error("浏览器无法保存记忆凭证，请允许本站本地存储后重试。");
 const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json",...headers},body:JSON.stringify({action,...extra})});
 const data=await response.json();
 if(!response.ok)throw new Error(data.error||"记忆请求失败");
 return data;
}
async function memoryTask(fn){
 const status=document.getElementById("memoryStatus");
 status.textContent="处理中…";
 try{await fn();status.textContent="操作成功。云端变更可能需要约一分钟同步。";}
 catch(e){status.textContent=e.message;}
}
async function refreshMemory(){
 const data=await memoryRequest("list");
 const list=document.getElementById("memoryList");list.replaceChildren();
 if(!data.memories.length)list.textContent="暂未保存记忆。";
 data.memories.forEach(m=>{
  const row=document.createElement("p"), label=document.createElement("span"),button=document.createElement("button");
  label.textContent=m.text+" ";button.textContent="删除";
  button.onclick=()=>memoryTask(async()=>{await memoryRequest("delete",{id:m.id});row.remove();});
  row.append(label,button);list.append(row);
 });
}
function openMemory(){
 const select=document.getElementById("memoryChoice");
 if(!select.options.length)Object.entries(memoryOptions).forEach(([id,text])=>select.add(new Option(text,id)));
 document.getElementById("memoryDialog").showModal();memoryTask(refreshMemory);
}
function saveMemory(){const id=document.getElementById("memoryChoice").value;
 if(confirm("同意将「"+memoryOptions[id]+"」保存到云端长期记忆？"))memoryTask(async()=>{await memoryRequest("save",{id,consent:true});await refreshMemory();});
}
function clearMemory(){if(confirm("确定删除此浏览器的全部云端记忆？"))memoryTask(async()=>{await memoryRequest("clear");document.getElementById("memoryList").textContent="已提交全部删除。";});}
const STORAGE_KEY="big-fish-chat-history-v1";
let history=[];
let sending=false;
let activeController=null;
function stopReply(){activeController?.abort();}
let session=0;

try{
  const saved=JSON.parse(
    localStorage.getItem(STORAGE_KEY)||"[]"
  );
  if(Array.isArray(saved)){
    history=saved.filter(x=>
      x&&typeof x.text==="string"&&
      ["me","fish"].includes(x.type)
    ).slice(-100);
  }
}catch(e){history=[]}

function saveHistory(){
  try{
    localStorage.setItem(
      STORAGE_KEY,JSON.stringify(history)
    );
  }catch(e){
    console.warn("保存失败",e);
  }
}


function addMessage(text,type,save=true,time=Date.now()){
  const wrap=document.createElement("div");
  wrap.className="message "+type;

  if(type==="fish"){
    const avatar=document.createElement("div");
    avatar.className="mini";
    avatar.textContent="🐳";
    wrap.appendChild(avatar);
  }

  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=text;
  wrap.appendChild(bubble);

  const clock=document.createElement("div");
  clock.className="time";
  clock.textContent=new Date(time).toLocaleTimeString(
    "zh-CN",{hour:"2-digit",minute:"2-digit"}
  );

  let record=save?{text,type,time}:
    history.find(item=>item.time===time&&item.type===type&&item.text===text);

  if(save){
    history.push(record);
    history=history.slice(-100);
    saveHistory();
  }

  if(record){
    const del=document.createElement("button");
    del.textContent="×";
    del.type="button";
    del.title="删除这条消息";
    del.style.cssText="margin:4px 0 0 8px;padding:3px 8px;border:0;border-radius:10px;background:#fff;color:#789;cursor:pointer;font-size:16px;";

    del.addEventListener("click",()=>{
      if(!confirm("确定删除这条消息吗？"))return;

      const index=history.indexOf(record);
      if(index<0)return;

      history.splice(index,1);
      saveHistory();

      chat.innerHTML="";
      if(history.length){
        history.forEach(item=>{
          addMessage(item.text,item.type,false,item.time);
        });
      }else{
        welcome();
      }
    });

    if(type==="fish"){
      const copy=document.createElement("button");
      copy.type="button";copy.textContent="复制";copy.title="复制这条回答";
      copy.style.cssText="margin:4px 0 0 8px;padding:3px 8px;border:0;border-radius:10px;background:#fff;color:#456;cursor:pointer;";
      copy.addEventListener("click",async()=>{
        try{
          await navigator.clipboard.writeText(record.text);
          copy.textContent="已复制";
          setTimeout(()=>{copy.textContent="复制";},1500);
        }catch{
          const dialog=document.createElement("dialog");
          const info=document.createElement("p");info.textContent="自动复制不可用，请选中下方文字后手动复制。";
          const area=document.createElement("textarea");area.value=record.text;area.readOnly=true;
          area.style.cssText="width:100%;height:220px";
          const close=document.createElement("button");close.textContent="关闭";close.onclick=()=>dialog.close();
          dialog.append(info,area,close);dialog.style.cssText="width:85%;max-width:600px;border:0;border-radius:12px;padding:20px";
          dialog.addEventListener("close",()=>dialog.remove(),{once:true});
          document.body.append(dialog);dialog.showModal();area.focus();area.select();
        }
      });
      wrap.appendChild(copy);
    }
    wrap.appendChild(del);
  }

  chat.appendChild(clock);
  chat.appendChild(wrap);
  chat.scrollTop=chat.scrollHeight;

  return {wrap,clock};
}


function welcome(){
  addMessage(
    "🐳 你好呀！我是大肥鱼～今天想聊些什么？🍚",
    "fish",false
  );
}

if(history.length){
  history.forEach(x=>
    addMessage(x.text,x.type,false,x.time||Date.now())
  );
}else{
  welcome();
}

function exportChat(){
 if(!history.length){alert("还没有可导出的聊天记录。");return;}
 const lines=["大肥鱼聊天记录", "导出时间："+new Date().toLocaleString("zh-CN"), "仅包含此浏览器的聊天记录，不包含云端长期记忆。", ""];
 history.forEach(item=>{lines.push((item.type==="me"?"我":"大肥鱼")+" · "+new Date(item.time).toLocaleString("zh-CN"),item.text,"");});
 const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/plain;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="大肥鱼聊天记录-"+new Date().toISOString().slice(0,10)+".txt";
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}

function clearChat(){
  if(!confirm("确定清空聊天记录吗？"))return;
  session++;
  stopReply();
  history=[];
  saveHistory();
  chat.innerHTML="";
  welcome();
}

async function readReplyStream(response,onText){
 const reader=response.body.getReader(),decoder=new TextDecoder();
 let buffer="",doneMarker=false;
 function event(block){
  const data=block.split("\n").filter(x=>x.startsWith("data:")).map(x=>x.slice(5).trimStart()).join("\n");
  if(!data)return;
  if(data.trim()==="[DONE]"){doneMarker=true;return;}
  const packet=JSON.parse(data);
  if(packet.error)throw new Error("模型服务返回错误，请重试。");
  const part=packet.choices?.[0]?.delta?.content;
  if(typeof part==="string")onText(part);
 }
 try{
  while(!doneMarker){
   const {value,done}=await reader.read();
   buffer+=done?decoder.decode():decoder.decode(value,{stream:true});
   buffer=buffer.replace(/\r\n/g,"\n");
   let boundary;
   while((boundary=buffer.indexOf("\n\n"))>=0){event(buffer.slice(0,boundary));buffer=buffer.slice(boundary+2);if(doneMarker)break;}
   if(done){if(buffer.trim())event(buffer);break;}
  }
  if(!doneMarker)throw new Error("回复连接中断，请重试。");
 }finally{try{await reader.cancel();}catch{}reader.releaseLock();}
}

function goBottom(){chat.scrollTop=chat.scrollHeight;}
function applyTheme(dark){document.body.classList.toggle("dark",dark);document.getElementById("themeBtn").textContent=dark?"切换浅色模式":"切换深色模式";document.querySelector('meta[name="theme-color"]').content=dark?"#142438":"#e8f5ff";}
function toggleTheme(){const dark=!document.body.classList.contains("dark");applyTheme(dark);try{localStorage.setItem("fish-theme",dark?"dark":"light");}catch{}}
try{applyTheme(localStorage.getItem("fish-theme")==="dark");}catch{}
function regenerate(){
 if(sending)return;
 let index=history.length-1;
 while(index>=0&&history[index].type!=="me")index--;
 if(index<0){alert("请先发送一条消息。");return;}
 if(requestedPreference(history[index].text)){alert("记忆操作请使用顶部记忆入口查看或修改，不会重新执行。");return;}
 send(history[index].text,history.slice(0,index));
}

function requestedPreference(text){
 const match=text.match(/^(?:请)?(?:帮我)?记住[，,:：\s]*(?:我)?(.+?)[。！!]?$/);
 if(!match)return null;
 const facts={"喜欢白米饭":"rice","喜欢面条":"noodles","喜欢水果":"fruit","喜欢阅读":"reading","喜欢音乐":"music","喜欢游戏":"games","希望回答简短":"concise","希望回答详细":"detailed"};
 return facts[match[1]]||"unsupported";
}

async function send(retryText=null,retryHistory=null){
  const text=retryText===null?input.value.trim():retryText;
  if(!text||sending)return;

  const preference=retryText===null?requestedPreference(text):null;
  if(preference){
    input.value="";
    addMessage(text,"me");
    if(preference==="unsupported"){
      addMessage("目前仅能保存：喜欢白米饭、面条、水果、阅读、音乐、游戏，以及希望回答简短或详细。请用‘记住，我喜欢面条’这样的完整句子；其他内容不会保存。","fish");
      return;
    }
    if(!confirm("同意将「"+memoryOptions[preference]+"」保存到云端长期记忆？")){
      addMessage("已取消，没有保存这条长期记忆。","fish");return;
    }
    const memorySession=session;
    sending=true;sendBtn.disabled=true;
    try{
      await memoryRequest("save",{id:preference,consent:true});
      if(memorySession===session)addMessage("已保存长期记忆："+memoryOptions[preference]+"。约一分钟后同步，可在顶部长期记忆入口查看或删除。","fish");
    }catch(e){if(memorySession===session)addMessage("保存未确认成功："+e.message+"。请稍后在记忆入口查看。","fish");}
    finally{sending=false;sendBtn.disabled=false;}
    return;
  }
  const currentSession=session;
  sending=true;
  sendBtn.disabled=true;
  if(retryText===null){addMessage(text,"me");input.value="";}

  const controller=new AbortController();
  activeController=controller;
  document.getElementById("stopBtn").hidden=false;
  let reply="";
  const waiting=addMessage(
    "大肥鱼正在思考...","fish thinking",false
  );

  try{
    const response=await fetch(API_URL,{
      signal:controller.signal,
      method:"POST",
      headers:{"Content-Type":"application/json",...memoryHeaders()},
      body:JSON.stringify({
  stream:true,
  message:text,
  history:(retryHistory===null?history.slice(0,-1):retryHistory).slice(-11).map(item=>({
    role:item.type==="fish"?"assistant":"user",
    content:item.text
  }))
})
    });

    if(!response.ok){const error=await response.json();throw new Error(error.error||"请求失败");}
    if(response.headers.get("content-type")?.includes("text/event-stream")){
      await readReplyStream(response,part=>{
        if(currentSession!==session)return;
        reply+=part;
        waiting.wrap.querySelector(".bubble").textContent=reply;
        if(chat.scrollHeight-chat.scrollTop-chat.clientHeight<180)goBottom();
      });
    }else{const data=await response.json();reply=data.reply||"";}
    if(!reply.trim())throw new Error("这次未收到回复，请重试。");
  }catch(error){
    if(currentSession!==session)return;
    if(error.name==="AbortError")reply+=(reply?"\n":"")+"[已停止回答]";
    else reply+=(reply?"\n[回复中断] ":"")+ (error.message||"云端连接失败，请稍后再试。");
  }finally{
    waiting.wrap.remove();waiting.clock.remove();
    if(currentSession===session)addMessage(reply,"fish");
    if(activeController===controller)activeController=null;
    document.getElementById("stopBtn").hidden=true;
    sending=false;
    sendBtn.disabled=false;
  }
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}
});
</script>
</body>
</html>
